name: check

# Checks the generated pages and the static release fallback against the latest
# MorseCQ release. The daily run catches a release the page has not caught up with.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated site files are up to date
        run: python3 tool/build.py --check
      - run: python3 tool/check_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
